name: Python CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Stage 1: Download the code and prepare Python.
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Stage 2: Install application dependencies and run unit tests.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v

      # Stage 3: Build the image and map host port 8000 to container port 5000.
      - name: Build Docker image
        run: docker build -t python-cicd-app:test .

      - name: Start test container
        run: docker run -d --name python-cicd-test -p 8000:5000 python-cicd-app:test

      
      # Stage 4: Wait for Flask and verify the health endpoint.
      - name: Check container health
        run: |
          for attempt in {1..15}; do
            echo "Health check attempt $attempt of 15"

            if curl --fail --silent http://127.0.0.1:8000/health -o health.json; then
              cat health.json
              python -c 'import json; from pathlib import Path; assert json.loads(Path("health.json").read_text()) == {"status": "healthy"}'
              echo "Application is healthy!"
              exit 0
            fi

            echo "Application is not ready yet. Retrying in 2 seconds..."
            sleep 2
          done

          echo "Health check failed. Inspecting container..."

          docker ps -a
          docker inspect python-cicd-test --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true
          docker logs python-cicd-test || true

          exit 1


      # Stage 5: Show diagnostics on failure and always remove the test container.
      - name: Show container logs on failure
        if: failure()
        run: docker logs python-cicd-test || true

      - name: Stop and remove test container
        if: always()
        run: docker rm -f python-cicd-test || true

      # Stage 6: Only successful pushes to main may log in and publish.
      # Pull requests and manual runs do not use Docker Hub credentials.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="$DOCKERHUB_USERNAME/python-cicd-app"
          docker tag python-cicd-app:test "$IMAGE_NAME:latest"
          docker tag python-cicd-app:test "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
